            }

            }

        @keyframes blobMove4 {

            from {

                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);

        @keyframes slideInLeft {

                transform: translateX(-30px);

                opacity: 1;
                transform: translateX(0);
            }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(30px);
            }

            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        @keyframes scaleIn {
            from {
                opacity: 0;
                transform: scale(0.9);
            }

            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {

            0%,
            100% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.05);
            }

        @keyframes shimmer {
            0% {

            }

            100% {
                background-position: 200% 0;
            }

        @keyframes float {

            100% {
                transform: translateY(0px);
            }

            50% {
                transform: translateY(-10px);
            }

        .animate-slide-left {
            animation: slideInLeft 0.5s ease-out forwards;
        }

        .animate-slide-right {
            animation: slideInRight 0.5s ease-out forwards;
        }

        .animate-scale-in {
            animation: scaleIn 0.4s ease-out forwards;
        }

        .animate-float {
            animation: float 3s ease-in-out infinite;

        .premium-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .premium-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.5s;
        }

        .premium-card:hover::before {
            left: 100%;
        }

            transform: translateY(-4px);
            box-shadow: 0 12px 40px -12px rgba(66, 133, 244, 0.35);

            grid-auto-flow: dense;

        }

        .stat-card {

            content: '';
            position: absolute;

            height: 1rem;

        }

            background: #FBBC05;
        }

        .timeline-item:nth-child(4)::before {
            background: #34A853;
        }

        .quote-block {
            position: relative;

            font-weight: 700;
            border-radius: 2rem;
            box-shadow: 0 4px 12px rgba(234, 67, 53, 0.3);

        }
    </style>

        // Gauge Chart Component
        const GaugeChart = ({ score, max = 12, label }) => {
            const segments = [
                { color: "#EF4444", range: "0-2" },
                { color: "#F97316", range: "2-4" },
                { color: "#EAB308", range: "4-6" },
                { color: "#9CA3AF", range: "6-8" },
                { color: "#10B981", range: "8-10" },
                { color: "#3B82F6", range: "10-12" }
            ];
            const radius = 80;
            const stroke = 20;
            const normalizedScore = Math.min(Math.max(score, 0), max);
            const angle = (normalizedScore / max) * 180 - 90;

            const polarToCartesian = (centerX, centerY, r, angleInDegrees) => {
                const angleInRadians = (angleInDegrees - 180) * Math.PI / 180.0;
                return { x: centerX + (r * Math.cos(angleInRadians)), y: centerY + (r * Math.sin(angleInRadians)) };
            };

            const createArc = (startAngle, endAngle) => {
                const start = polarToCartesian(100, 100, radius, endAngle);
                const end = polarToCartesian(100, 100, radius, startAngle);
                const largeArcFlag = endAngle - startAngle <= 180 ? "0" : "1";
                return ["M", start.x, start.y, "A", radius, radius, 0, largeArcFlag, 0, end.x, end.y].join(" ");
            };

            return (
                <div className=" flex flex-col items-center justify-center p-4">
                    <div className="relative w-64 h-32 overflow-hidden mb-4">
                        <svg viewBox="0 0 200 110" className="w-full h-full">
                            {segments.map((seg, i) => {
                                const start = (i * 30);
                                const end = ((i + 1) * 30);
                                return (
                                    <path key={i} d={createArc(start, end)} fill="none" stroke={seg.color} strokeWidth={stroke}
                                        strokeDasharray="1 1" />);
                            })}
                            <g className="gauge-needle" style={{
                                transform: `rotate(${angle}deg)`, transformOrigin: "100px 100px"
                            }}>
                                <polygon points="100,100 95,20 100,10 105,20" fill="#0ea5e9" />
                                <circle cx="100" cy="100" r="5" fill="#0ea5e9" />
                            </g>
                        </svg>
                        <div className="absolute bottom-0 w-full text-center">
                            <span className="text-3xl font-bold text-brand-600 brand-serif">{score}</span>
                            <span className="text-xs text-gray-500 ml-1">/ {max}</span>
                        </div>
                    </div>
                    <div className="flex gap-1 text-[10px] uppercase font-bold text-gray-400">
                        {segments.map((s, i) => <span key={i} style={{ color: s.color }}>{s.range}</span>)}
                    </div>
                    <p className="mt-2 text-sm font-bold text-gray-600">{label}</p>
                </div>
            );
        };

                                            <div className="masonry-grid">
                                                {currentSection.flashcards.map((f, i) =>
                                                    <Flashcard key={i} front={f.front} back={f.back} />)}
                                            </div>
                                        )}

                                        {currentSection.quiz?.length > 0 && <SelfCheck questions={currentSection.quiz}
                                            answers={quizScores[currentSection.id] || {}} onAnswer={(qIdx, score) =>
                                                handleQuizAnswer(currentSection.id, qIdx, score)} labels={APP_DATA.labels} />}
                                    </div>
                                ) : activeSection === 5 ? (
                                    /* Layout 3: 團隊介紹頁 - 瀑布流 */
                                    <div className="space-y-8 animate-fade-in">
                                        {/* Hero */}
                                        <div className="hero-section hero-green">
                                            <div className="hero-content">
                                                <h3 className="text-3xl font-bold mb-2">我們的團隊</h3>
                                                <p className="opacity-90">認識專案製作團隊成員</p>
                                            </div>
                                        </div>

                                        {/* 團隊成員瀑布流 */}
                                        {currentSection.team && (
                                            <div className="masonry-grid">
                                                {currentSection.team.members.map((m, i) => (
                                                    <div key={i} className={`glass premium-card p-6 rounded-2xl text-center stagger-item
                                        animate-scale-in ${i === 0 ? 'masonry-item-tall' : ''}`} style={{
                                                            animationDelay:
                                                                `${i * 0.1}s`
                                                        }}>
                                                        <img src={m.img} alt={m.name}
                                                            className="w-20 h-20 rounded-full mx-auto mb-4 object-cover shadow-google" />
                                                        <h4 className="font-bold text-gray-800 dark:text-white">{m.name}</h4>
                                                        <p className={`text-sm ${['text-google-blue', 'text-google-red'
                                                            , 'text-google-yellow', 'text-google-green'][i % 4]}`}>{m.role}</p>
                                                    </div>
                                                ))}
                                            </div>
                                        )}

                                        {/* 團隊心得 */}
                                        {currentSection.team?.reflection && (
                                            <div className="quote-block">
                                                {currentSection.team.reflection}
                                            </div>
                                        )}

                                        {/* 影片區 */}
                                        {currentSection.videos && (
                                            <div className="skew-section">
                                                <h3
                                                    className="text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center">
                                                    <i className="fas fa-play-circle text-google-red mr-2"></i>
                                                    團隊自我介紹影片
                                                </h3>
                                                <div className="masonry-grid">
                                                    {currentSection.videos.map((v, i) =>
                                                        <VideoCard key={i} video={v} label={APP_DATA.labels.watchVideo} />)}
                                                </div>
                                            </div>
                                        )}

                                        {currentSection.quiz?.length > 0 && <SelfCheck questions={currentSection.quiz}
                                            answers={quizScores[currentSection.id] || {}} onAnswer={(qIdx, score) =>
                                                handleQuizAnswer(currentSection.id, qIdx, score)} labels={APP_DATA.labels} />}
                                    </div>
                                ) : activeSection === 2 ? (
                                    /* Layout 4: 核心能力頁 - 全寬特色卡片 */
                                    <div className="space-y-8 animate-fade-in">
                                        {/* Hero 紅色 */}
                                        <div className="hero-section hero-red">
                                            <div className="hero-content">
                                                <h3 className="text-3xl font-bold mb-2">核心能力需求</h3>
                                                <p className="opacity-90">成為 Google PM 需要具備的關鍵能力</p>
                                            </div>
                                        </div>

                                        {/* 全寬特色卡片 */}
                                        <div className="space-y-4">
                                            {currentSection.highlights?.map((h, i) => {
                                                const cardColors = ['card-blue', 'card-red', 'card-yellow', 'card-green'];
                                                const icons = ['fa-brain', 'fa-users', 'fa-chart-bar', 'fa-lightbulb', 'fa-code'];
                                                return (
                                                    <div key={i} className={`feature-card ${cardColors[i % 4]} premium-card stagger-item
                                        animate-slide-left relative`} style={{ animationDelay: `${i * 0.1}s` }}>
                                                        {i === 0 && <span className="floating-badge">重要</span>}
                                                        <div className="flex items-center gap-4">
                                                            <div
                                                                className="w-12 h-12 rounded-full bg-white/20 flex items-center justify-center shrink-0">
                                                                <i className={`fas ${icons[i % 5]} text-xl`}></i>
                                                            </div>
                                                            <p className="text-base leading-relaxed">{h}</p>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>

                                        {/* Action Plan 時間軸 */}
                                        {currentSection.actionPlan && (
                                            <div className="skew-section">
                                                <h3
                                                    className="text-lg font-bold text-gray-800 dark:text-white mb-6 flex items-center">
                                                    <i className="fas fa-route text-google-blue mr-2"></i>
                                                    {APP_DATA.labels.actionPlan}
                                                </h3>
                                                <div className="timeline">
                                                    {currentSection.actionPlan.map((a, i) => (
                                                        <div key={i} className="timeline-item stagger-item animate-slide-left" style={{
                                                            animationDelay: `${i * 0.1}s`
                                                        }}>
                                                            <p className="text-sm font-medium text-gray-700 dark:text-gray-300">{a}</p>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <ThemeExplorer themes={currentSection.themes} label={APP_DATA.labels.themes} />

                                        {/* Flashcards */}
                                        {currentSection.flashcards?.length > 0 && (
                                            <div className="masonry-grid">
                                                {currentSection.flashcards.map((f, i) =>
                                                    <Flashcard key={i} front={f.front} back={f.back} />)}
                                            </div>
                                        )}

                                        {currentSection.quiz?.length > 0 && <SelfCheck questions={currentSection.quiz}
                                            answers={quizScores[currentSection.id] || {}} onAnswer={(qIdx, score) =>
                                                handleQuizAnswer(currentSection.id, qIdx, score)} labels={APP_DATA.labels} />}
                                    </div>
                                ) : activeSection === 3 ? (
                                    /* Layout 5: 技能對應頁 - 瀑布流卡片 */
                                    <div className="space-y-8 animate-fade-in">
                                        {/* Hero 黃色 */}
                                        <div className="hero-section hero-yellow">
                                            <div className="hero-content" style={{ color: '#333' }}>
                                                <h3 className="text-3xl font-bold mb-2">具體技能對應</h3>
                                                <p className="opacity-80">將核心能力轉化為可實踐的具體技能</p>
                                            </div>
                                        </div>

                                        {/* 瀑布流 Highlights */}
                                        <div className="masonry-grid">
                                            {currentSection.highlights?.map((h, i) => (
                                                <div key={i} className={`glass premium-card p-5 rounded-2xl stagger-item
                                        animate-scale-in ${i % 3 === 0 ? 'masonry-item-tall' : ''}`} style={{
                                                        animationDelay: `${i * 0.08}s`
                                                    }}>
                                                    <div className={`w-8 h-8 rounded-full ${['bg-google-blue', 'bg-google-red'
                                                        , 'bg-google-yellow', 'bg-google-green'][i % 4]} text-white flex
                                            items-center justify-center text-sm mb-3`}>
                                                        <i className="fas fa-check"></i>
                                                    </div>
                                                    <p className="text-sm text-gray-700 dark:text-gray-300 leading-relaxed">{h}</p>
                                                </div>
                                            ))}
                                        </div>

                                        {/* 交錯排版 Action Plan */}
                                        {currentSection.actionPlan && (
                                            <div className="skew-section skew-alt">
                                                <h3
                                                    className="text-lg font-bold text-gray-800 dark:text-white mb-4 flex items-center">
                                                    <i className="fas fa-clipboard-list text-google-red mr-2"></i>
                                                    {APP_DATA.labels.actionPlan}
                                                </h3>
                                                <div className="space-y-3">
                                                    {currentSection.actionPlan.map((a, i) => (
                                                        <div key={i} className="zigzag-item stagger-item animate-fade-in" style={{
                                                            animationDelay: `${i * 0.1}s`
                                                        }}>
                                                            <div className="zigzag-content">
                                                                <div className={`feature-card ${['card-blue', 'card-red', 'card-yellow'
                                                                    , 'card-green'][i % 4]} premium-card`}>
                                                                    <p className="text-sm">{a}</p>
                                                                </div>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                            </div>
                                        )}

                                        <ThemeExplorer themes={currentSection.themes} label={APP_DATA.labels.themes} />

                                        {currentSection.flashcards?.length > 0 && (
                                            <div className="masonry-grid">
                                                {currentSection.flashcards.map((f, i) =>
                                                    <Flashcard key={i} front={f.front} back={f.back} />)}
                                            </div>
                                        )}

                                        {currentSection.quiz?.length > 0 && <SelfCheck questions={currentSection.quiz}
                                            answers={quizScores[currentSection.id] || {}} onAnswer={(qIdx, score) =>
                                                handleQuizAnswer(currentSection.id, qIdx, score)} labels={APP_DATA.labels} />}
                                    </div>
                                ) : (
                                    /* 預設 Layout: 雙欄式 */
                                    <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
                                        {/* Left Column */}
                                        <div className="lg:col-span-7 space-y-6">
                                            {/* Highlights */}
                                            {currentSection.highlights && currentSection.highlights.length > 0 && (
                                                <section className="stagger-item animate-fade-in">
                                                    <h3
                                                        className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3 flex items-center">
                                                        <i className="fas fa-star text-google-yellow mr-2"></i>
                                                        {APP_DATA.labels.highlights}
                                                    </h3>
                                                    <div
                                                        className="glass premium-card p-5 rounded-2xl border-l-4 border-google-blue space-y-3">
                                                        {currentSection.highlights.map((h, i) => (
                                                            <div key={i} className="flex items-start stagger-item animate-slide-left"
                                                                style={{ animationDelay: `${i * 0.1}s` }}>
                                                                <div
                                                                    className="w-6 h-6 rounded-full bg-google-green/10 flex items-center justify-center mr-3 shrink-0">
                                                                    <i className="fas fa-check text-google-green text-xs"></i>
                                                                </div>
                                                                <p className="text-sm text-gray-700 dark:text-gray-300 leading-relaxed">
                                                                    {h}</p>
                                                            </div>
                                                        ))}
                                                    </div>
                                                </section>
                                            )}

                                            {/* Action Plan */}
                                            {currentSection.actionPlan && currentSection.actionPlan.length > 0 && (
                                                <section className="stagger-item animate-fade-in" style={{
                                                    animationDelay: '0.2s'
                                                }}>
                                                    <h3
                                                        className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3 flex items-center">
                                                        <i className="fas fa-rocket text-google-red mr-2"></i>
                                                        {APP_DATA.labels.actionPlan}
                                                    </h3>
                                                    <div
                                                        className="glass premium-card p-5 rounded-2xl border-l-4 border-google-green">
                                                        <ul className="space-y-3">
                                                            {currentSection.actionPlan.map((a, i) => {
                                                                const googleColors = ['bg-google-blue', 'bg-google-red',
                                                                    'bg-google-yellow', 'bg-google-green'];
                                                                const colorClass = googleColors[i % 4];
                                                                return (
                                                                    <li key={i}
                                                                        className="flex items-center text-sm font-medium text-gray-700 dark:text-gray-200 stagger-item animate-slide-left"
                                                                        style={{ animationDelay: `${i * 0.1}s` }}>
                                                                        <span className={`w-7 h-7 rounded-full ${colorClass} text-white flex
                                                        items-center justify-center text-xs mr-3 shadow-sm font-bold`}>
                                                                            {i + 1}
                                                                        </span>
                                                                        {a}
                                                                    </li>
                                                                );
                                                            })}
                                                        </ul>
                                                    </div>
                                                </section>
                                            )}

                                            {/* Keywords & Theme Explorer */}
                                            {currentSection.keywords && currentSection.keywords.length > 0 && (
                                                <section className="stagger-item animate-fade-in" style={{
                                                    animationDelay: '0.3s'
                                                }}>
                                                    <h3
                                                        className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3 flex items-center">
                                                        <i className="fas fa-tags text-google-blue mr-2"></i>
                                                        關鍵字
                                                    </h3>
                                                    <div className="flex flex-wrap gap-2 mb-4">
                                                        {currentSection.keywords.map((k, i) => {
                                                            const googleColors = ['bg-google-blue', 'bg-google-red', 'bg-google-yellow',
                                                                'bg-google-green'];
                                                            const colorClass = googleColors[i % 4];
                                                            return (
                                                                <button key={i} onClick={() => handleKeywordClick(k)}
                                                                    className={`px-4 py-2 ${colorClass} text-white rounded-full text-xs
                                                font-semibold hover:scale-105 transition-all shadow-sm cursor-pointer
                                                btn-premium`}
                                                                >
                                                                    #{k}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                    <ThemeExplorer themes={currentSection.themes} label={APP_DATA.labels.themes} />
                                                </section>
                                            )}

                                            {/* Gallery */}
                                            {currentSection.gallery &&
                                                <GallerySection gallery={currentSection.gallery} />}

                                            {/* Team */}
                                            {currentSection.team &&
                                                <TeamSection team={currentSection.team} />}
                                        </div>

                                        {/* Right Column */}
                                        <div className="lg:col-span-5 space-y-6">
                                            {/* Videos */}
                                            {currentSection.videos && currentSection.videos.length > 0 && (
                                                <section className="stagger-item animate-slide-right">
                                                    <h3
                                                        className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3 flex items-center">
                                                        <i className="fas fa-play-circle text-google-red mr-2"></i>
                                                        {APP_DATA.labels.videos}
                                                    </h3>
                                                    <div className="grid gap-4">
                                                        {currentSection.videos.map((v, i) =>
                                                            <VideoCard key={i} video={v} label={APP_DATA.labels.watchVideo} />)}
                                                    </div>
                                                </section>
                                            )}

                                            {/* Flashcards */}
                                            {currentSection.flashcards && currentSection.flashcards.length > 0 && (
                                                <section className="stagger-item animate-slide-right" style={{
                                                    animationDelay: '0.1s'
                                                }}>
                                                    <h3
                                                        className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3 flex items-center">
                                                        <i className="fas fa-clone text-google-yellow mr-2"></i>
                                                        {APP_DATA.labels.flashcards}
                                                    </h3>
                                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3">
                                                        {currentSection.flashcards.map((f, i) =>
                                                            <Flashcard key={i} front={f.front} back={f.back} />)}
                                                    </div>
                                                </section>
                                            )}

                                            {/* Self-Check Quiz */}
                                            {currentSection.quiz && currentSection.quiz.length > 0 && (
                                                <section className="stagger-item animate-slide-right" style={{
                                                    animationDelay: '0.2s'
                                                }}>
                                                    <h3
                                                        className="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-3 flex items-center">
                                                        <i className="fas fa-clipboard-check text-google-green mr-2"></i>
                                                        {APP_DATA.labels.quiz}
                                                    </h3>
                                                    <SelfCheck questions={currentSection.quiz}
                                                        answers={quizScores[currentSection.id] || {}} onAnswer={(qIdx, score) =>
                                                            handleQuizAnswer(currentSection.id, qIdx, score)}
                                                        labels={APP_DATA.labels}
                                                    />
                                                </section>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Footer with Glossary */}
                                <footer ref={footerRef}
                                    className="mt-16 border-t border-slate-100 dark:border-slate-800 pt-8">
                                    <div className="flex flex-col md:flex-row justify-between items-start gap-8">
                                        {/* Glossary */}
                                        <div className="w-full md:w-2/3">
                                            <label
                                                className="block text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-3">{APP_DATA.labels.glossary}</label>
                                            <div className="relative">
                                                <select
                                                    className="w-full p-4 pl-12 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-700 rounded-lg text-sm text-slate-700 dark:text-slate-300 focus:ring-2 focus:ring-brand-500 outline-none appearance-none shadow-sm cursor-pointer brand-serif"
                                                    onChange={(e) => setSelectedGlossaryKey(e.target.value)}
                                                    value={selectedGlossaryKey}
                                                >
                                                    <option value="">{APP_DATA.meta.glossaryPrompt}</option>
                                                    {displayGlossary.map((g, i) => <option key={i} value={g.key}>{g.t}
                                                    </option>)}
                                                </select>
                                                <i
                                                    className="fas fa-search absolute left-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                                            </div>
                                            {currentGlossaryDefinition && (
                                                <div
                                                    className="mt-4 p-5 bg-brand-50 dark:bg-slate-800 rounded-lg border-l-4 border-brand-500 text-slate-700 dark:text-slate-300 text-sm brand-serif leading-relaxed animate-fade-in shadow-sm">
                                                    {currentGlossaryDefinition}
                                                </div>
                                            )}
                                        </div>

                                        {/* Navigation Buttons */}
                                        <div className="flex space-x-4 pt-6">
                                            <button onClick={() => {
                                                setActiveSection(Math.max(0, activeSection - 1));
                                                window.scrollTo(0, 0);
                                            }}
                                                disabled={activeSection === 0}
                                                className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${activeSection === 0 ? 'bg-slate-100 text-slate-300' : 'bg-white text-brand-600 border border-slate-200 hover:border-brand-500 hover:bg-brand-600 hover:text-white shadow-md'}`}
                                            >
                                                <i className="fas fa-arrow-left"></i>
                                            </button>
                                            <button onClick={() => {
                                                setActiveSection(Math.min(APP_DATA.sections.length - 1,
                                                    activeSection + 1)); window.scrollTo(0, 0);
                                            }}
                                                disabled={activeSection === APP_DATA.sections.length - 1}
                                                className={`w-12 h-12 rounded-full flex items-center justify-center transition-all ${activeSection === APP_DATA.sections.length - 1 ? 'bg-slate-100 text-slate-300' : 'bg-brand-600 text-white hover:bg-brand-700 shadow-md hover:shadow-lg'}`}
                                            >
                                                <i className="fas fa-arrow-right"></i>
                                            </button>
                                        </div>
                                    </div>

                                    {/* Copyright */}
                                    <div className="flex flex-col md:flex-row justify-between items-center mt-10 text-[10px] text-slate-400 border-t border-slate-50 dark:border-slate-800 pt-6">
                                        <div className="flex items-center gap-2 mb-2 md:mb-0">
                                            <i className="fa-solid fa-university text-lg"></i>
                                            <span>{currentFooter.uni}</span>
                                        </div>
                                        <div className="flex flex-col md:flex-row items-center gap-2 md:gap-6">
                                            <div className="flex items-center gap-2">
                                                <span>© {currentFooter.year}</span>
                                                <span className="hidden md:inline">•</span>
                                                <span>{currentFooter.team}</span>
                                            </div>
                                            <span className="hidden md:inline">•</span>
                                            <span>Instructor: {currentFooter.prof}</span>
                                        </div>
                                    </div>
                                </footer>
                            </div>
                        </main>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(
            <App />);
    </script>
</body>

</html>
